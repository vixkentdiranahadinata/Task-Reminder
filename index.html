    <!-- INLINE SERVICE WORKER UNTUK INSTALLATION PROMPT -->
    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => {
                    self.skipWaiting();
                });
                self.addEventListener('activate', (e) => {
                    e.waitUntil(clients.claim());
                });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            
            window.addEventListener('load', () => {
                navigator.serviceWorker.register(swUrl)
                    .then(reg => console.log('Service Worker Berhasil Terdaftar (PWA Ready)'))
                    .catch(err => console.log('Service Worker Gagal', err));
            });
        }
    </script>

    <style>
        body { 
            -webkit-tap-highlight-color: transparent; 
            overscroll-behavior-y: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #f3f4f6;
        }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom scrollbar for desktop */
        @media (min-width: 768px) {
            .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
            .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
            .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.5); border-radius: 10px; }
            .custom-scrollbar:hover::-webkit-scrollbar-thumb { background-color: rgba(156, 163, 175, 0.8); }
        }

        .active-press:active { transform: scale(0.96); transition: transform 0.1s; }
        
        @keyframes pulse-screen {
            0% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
            50% { box-shadow: inset 0 0 50px 20px rgba(239, 68, 68, 0.5); }
            100% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .alarm-active { animation: pulse-screen 1s infinite; }
        
        /* Status Indicators */
        .status-dot { position: absolute; bottom: 0; right: 0; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; z-index: 10; }
        .dark-mode .status-dot { border-color: #1f2937; }
        .status-online { background-color: #22c55e; }
        .status-idle { background-color: #eab308; }
        .status-dnd { background-color: #ef4444; }
        .status-invisible { background-color: #6b7280; }

        /* Custom Borders */
        .border-wrapper { position: relative; display: inline-block; border-radius: 9999px; transition: transform 0.2s; }
        .border-default img { border: 2px solid rgba(156, 163, 175, 0.5); }
        .border-blue_glow { box-shadow: 0 0 15px #3b82f6; border-radius: 50%; } .border-blue_glow img { border: 2px solid #60a5fa; }
        .border-gold_rush { background: linear-gradient(45deg, #ffd700, #ffec8b, #ffd700); padding: 4px; } .border-gold_rush img { border: 2px solid #b8860b; }
        .border-crimson { background: linear-gradient(to bottom, #ef4444, #7f1d1d); padding: 4px; box-shadow: 0 0 10px #ef4444; } .border-crimson img { border: 2px solid #450a0a; }
        .border-rainbow { background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); padding: 4px; animation: spin 4s linear infinite; } .border-rainbow img { border: 2px solid white; }
        .border-neon_pink { box-shadow: 0 0 15px #ec4899; border-radius: 50%; } .border-neon_pink img { border: 2px solid #f472b6; }
        .border-magma { background: linear-gradient(180deg, #facc15, #ef4444); padding: 4px; } .border-magma img { border: 2px solid #7f1d1d; }
        .border-cyber { border: 3px dashed #22d3ee; border-radius: 50%; padding: 2px; } .border-cyber img { border: 1px solid #0891b2; }
        .border-forest { background: linear-gradient(45deg, #22c55e, #14532d); padding: 4px; } .border-forest img { border: 2px solid #bbf7d0; }
        .border-pixel { box-shadow: 4px 0 0 #000, -4px 0 0 #000, 0 -4px 0 #000, 0 4px 0 #000; border-radius: 0; padding: 2px; } .border-pixel img { border-radius: 0; border: 2px solid white; }

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICONS ---

        const TrashIcon = (p) => <Icon {...p} path={<><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2-2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></>} />;

        const XIcon = (p) => <Icon {...p} path={<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>} />;
        const DownloadIcon = (p) => <Icon {...p} path={<><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></>} />;
        const SunIcon = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></>} />;
        const MoonIcon = (p) => <Icon {...p} path={<><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></>} />;
        const CameraIcon = (p) => <Icon {...p} path={<><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></>} />;
        const BellIcon = (p) => <Icon {...p} path={<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>} />;
        const FlameIcon = (p) => <Icon {...p} path={<><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-2.24-4.053-5.58-5.5a1 1 0 0 1-.22-.22c1.7 5.2.1 6.8-2.2 8.5 2.5 1 4.5 2.5 6.5 2.72Z"/><path d="M12 21.5c-3.5 0-6.5-2.5-7-7 .5-2 3-3 3-5 1.5 2.5 4 4 6 4 3 0 5-3 5-5 .5 1.5 1.5 3 1.5 6 0 3.5-3.5 7-8.5 7Z"/></>} />;
        const CoinIcon = (p) => <Icon {...p} path={<><circle cx="12" cy="12" r="10"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 18V6"/></>} />;
        const UserIcon = (p) => <Icon {...p} path={<><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>} />;
        const StoreIcon = (p) => <Icon {...p} path={<><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/><path d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"/></>} />;
        const ShieldIcon = (p) => <Icon {...p} path={<><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></>} />;
        const StopIcon = (p) => <Icon {...p} path={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2" /></>} />;
        const LockIcon = (p) => <Icon {...p} path={<><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></>} />;
        const PencilIcon = (p) => <Icon {...p} path={<><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></>} />;
        const FrameIcon = (p) => <Icon {...p} path={<><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></>} />;

        // --- CONSTANTS ---
        const DAYS = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
        const AVATARS = [
            "https://api.dicebear.com/7.x/adventurer/svg?seed=Felix",
            "https://api.dicebear.com/7.x/adventurer/svg?seed=Aneka",
            "https://api.dicebear.com/7.x/adventurer/svg?seed=Zoey",
            "https://api.dicebear.com/7.x/adventurer/svg?seed=Christopher",
            "https://api.dicebear.com/7.x/adventurer/svg?seed=Nala",
            "https://api.dicebear.com/7.x/adventurer/svg?seed=Midnight"
        ];
        const BORDERS = [
            { id: 'default', name: 'Polos', price: 0, css: 'border-default' },
            { id: 'blue_glow', name: 'Neon Biru', price: 500, css: 'border-blue_glow' },
            { id: 'neon_pink', name: 'Neon Pink', price: 750, css: 'border-neon_pink' },
            { id: 'forest', name: 'Hutan', price: 1000, css: 'border-forest' },
            { id: 'gold_rush', name: 'Sultan Emas', price: 2000, css: 'border-gold_rush' },
            { id: 'cyber', name: 'Cyberpunk', price: 2500, css: 'border-cyber' },
            { id: 'magma', name: 'Magma', price: 3000, css: 'border-magma' },
            { id: 'crimson', name: 'Raja Merah', price: 3500, css: 'border-crimson' },
            { id: 'pixel', name: 'Pixel Art', price: 4000, css: 'border-pixel' },
            { id: 'rainbow', name: 'Pelangi RGB', price: 6000, css: 'border-rainbow' }
        ];

        // --- HELPER FUNCTIONS ---
        const getDayName = (date) => {
            const dayIndex = date.getDay(); 
            const shiftedIndex = dayIndex === 0 ? 6 : dayIndex - 1;
            return DAYS[shiftedIndex];
        };
        const getLevel = (xp) => Math.floor(xp / 100) + 1;
        const getLevelProgress = (xp) => xp % 100;

        // --- COMPONENT: USER AVATAR ---
        const UserAvatar = ({ src, borderId = 'default', size = 'md', status, isDarkMode }) => {
            const borderClass = BORDERS.find(b => b.id === borderId)?.css || 'border-default';
            let dimClass = 'w-10 h-10', dotClass = 'w-3 h-3 border-2';
            if(size === 'sm') { dimClass = 'w-8 h-8'; }
            if(size === 'lg') { dimClass = 'w-14 h-14'; }
            if(size === 'xl') { dimClass = 'w-24 h-24'; dotClass = 'w-6 h-6 border-4'; }
            
            return (
                <div className={`relative inline-block border-wrapper ${borderClass}`}>
                    <img src={src} className={`${dimClass} rounded-full object-cover bg-gray-200`} alt="Avatar" />
                    {status && <div className={`status-dot status-${status} ${dotClass} absolute bottom-0 right-0 ${isDarkMode ? 'border-gray-900' : 'border-white'}`}></div>}
                </div>
            );
        };

        // --- MAIN APP COMPONENT ---
        function App() {
            // STATE: DATA
            const [schedules, setSchedules] = useState(() => JSON.parse(localStorage.getItem('mySchedules')) || []);
            const [points, setPoints] = useState(() => parseInt(localStorage.getItem('points') || '50'));
            const [xp, setXp] = useState(() => parseInt(localStorage.getItem('xp') || '0'));
            const [streak, setStreak] = useState(() => parseInt(localStorage.getItem('streak') || '0'));
            const [freezeInventory, setFreezeInventory] = useState(() => parseInt(localStorage.getItem('freeze') || '0'));
            const [lastActiveDate, setLastActiveDate] = useState(() => localStorage.getItem('lastActiveDate') || '');
            const [userStatus, setUserStatus] = useState(() => localStorage.getItem('userStatus') || 'online');
            const [ownedBorders, setOwnedBorders] = useState(() => JSON.parse(localStorage.getItem('ownedBorders')) || ['default']);
            const [userProfile, setUserProfile] = useState(() => {
                const saved = localStorage.getItem('userProfile');
                const initial = saved ? JSON.parse(saved) : { name: 'Player' + Math.floor(Math.random()*1000), avatar: AVATARS[0] };
                if(!initial.border) initial.border = 'default';
                return initial;
            });

            // STATE: UI
            const [activeTab, setActiveTab] = useState('home');
            const [selectedDay, setSelectedDay] = useState(getDayName(new Date()));
            const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') !== 'light'); // Default Dark
            const [isEditProfileModalOpen, setIsEditProfileModalOpen] = useState(false);
            const [isModalOpen, setIsModalOpen] = useState(false);
            const [toastMessage, setToastMessage] = useState(null);
            
            // STATE: TASK INPUT
            const [newTime, setNewTime] = useState('07:00');
            const [newEndTime, setNewEndTime] = useState('08:00');
            const [newTitle, setNewTitle] = useState('');
            const [newDay, setNewDay] = useState(getDayName(new Date()));

            // STATE: SYSTEM
            const [currentTime, setCurrentTime] = useState(new Date());
            const [isRinging, setIsRinging] = useState(false);
            const [currentAlarmTitle, setCurrentAlarmTitle] = useState('');
            const [notificationsEnabled, setNotificationsEnabled] = useState(false);

            // REFS
            const audioContextRef = useRef(null);
            const oscillatorRef = useRef(null);
            const notificationsSentRef = useRef(new Set());
            const fileInputRef = useRef(null);

            // --- EFFECTS ---

            // Persist Data
            useEffect(() => { localStorage.setItem('mySchedules', JSON.stringify(schedules)); }, [schedules]);
            useEffect(() => { localStorage.setItem('points', points); }, [points]);
            useEffect(() => { localStorage.setItem('xp', xp); }, [xp]);
            useEffect(() => { localStorage.setItem('streak', streak); }, [streak]);
            useEffect(() => { localStorage.setItem('freeze', freezeInventory); }, [freezeInventory]);
            useEffect(() => { localStorage.setItem('lastActiveDate', lastActiveDate); }, [lastActiveDate]);
            useEffect(() => { localStorage.setItem('userProfile', JSON.stringify(userProfile)); }, [userProfile]);
            useEffect(() => { localStorage.setItem('userStatus', userStatus); }, [userStatus]);
            useEffect(() => { localStorage.setItem('ownedBorders', JSON.stringify(ownedBorders)); }, [ownedBorders]);
            
            // Theme Application
            useEffect(() => { 
                localStorage.setItem('theme', isDarkMode ? 'dark' : 'light'); 
                const metaTheme = document.getElementById('theme-color-meta');
                if (metaTheme) metaTheme.setAttribute('content', isDarkMode ? '#111827' : '#ffffff');
                document.body.className = `h-screen overflow-hidden ${isDarkMode ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-800'} transition-colors duration-300`;
            }, [isDarkMode]);

            // Clean past tasks on load
            useEffect(() => {
                const todayShiftedIndex = (new Date().getDay() + 6) % 7; 
                setSchedules(prev => {
                    const clean = prev.filter(t => DAYS.indexOf(t.day) >= todayShiftedIndex);
                    if (clean.length !== prev.length) setTimeout(() => showToast("Jadwal lampau dibersihkan otomatis"), 500);
                    return clean;
                });
            }, []);

            // Timer & Notification Loop
            useEffect(() => {
                const timer = setInterval(() => {
                    const now = new Date();
                    setCurrentTime(now);
                    checkNotifications(now);
                }, 1000);
                return () => clearInterval(timer);
            }, [schedules, userStatus]);

            // Daily Login Logic
            useEffect(() => {
                const today = new Date().toDateString();
                if (lastActiveDate !== today) {
                    const yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);
                    const isConsecutive = lastActiveDate === yesterday.toDateString();
                    
                    if (lastActiveDate && !isConsecutive) {
                         if (freezeInventory > 0) {
                             setFreezeInventory(f => f - 1);
                             showToast("❄️ Freeze Aktif! Streak aman.");
                             setStreak(s => s + 1);
                         } else {
                             setStreak(1);
                             showToast("Streak terputus!");
                         }
                    } else {
                        setStreak(s => s + 1);
                        showToast(`Login Harian! +10 EXP`);
                        setXp(x => x + 10);
                    }
                    setLastActiveDate(today);
                }
            }, []);

            // --- FUNCTIONS ---

            const showToast = (msg) => {
                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3000);
            };

            const playCoinSound = () => {
                if (userStatus === 'dnd') return;
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const ctx = new AudioContext();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.type = 'sine'; 
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                    osc.start(); osc.stop(ctx.currentTime + 0.1);
                } catch(e) {}
            };

            const triggerAlarm = (title) => {
                if (userStatus === 'dnd' || isRinging) return;
                setIsRinging(true);
                setCurrentAlarmTitle(title);
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    audioContextRef.current = ctx;
                    const osc = ctx.createOscillator();
                    osc.connect(ctx.destination);
                    osc.type = 'square';
                    const interval = setInterval(() => {
                        if(oscillatorRef.current) osc.frequency.value = osc.frequency.value === 800 ? 1000 : 800;
                        else clearInterval(interval);
                    }, 500);
                    osc.start();
                    oscillatorRef.current = osc;
                } catch(e){}
            };

            const requestNotification = async () => {
                if (!('Notification' in window)) {
                    alert("Browser ini tidak mendukung notifikasi desktop.");
                    return;
                }
                const res = await Notification.requestPermission();
                setNotificationsEnabled(res === 'granted');
                if (res === 'granted') showToast("Notifikasi Sistem Aktif!");
            };

            const fireSystemNotification = (title, body) => {
                if (userStatus === 'dnd') return;
                if (Notification.permission === 'granted') {
                    try { new Notification(title, { body, icon: "https://cdn-icons-png.flaticon.com/512/3239/3239952.png" }); } catch(e){}
                }
            };

            const checkNotifications = (now) => {
                if (userStatus === 'dnd') return;
                const timeStr = now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit', hour12:false}).replace('.',':');
                const dayName = getDayName(now);

                schedules.forEach(t => {
                    if (t.day !== dayName || !t.active) return;
                    
                    // Pre-alert 10 min
                    const [h, m] = t.time.split(':').map(Number);
                    const target = new Date(now); target.setHours(h, m, 0, 0);
                    const diff = (target - now) / 60000;
                    
                    if (diff > 9 && diff < 10) {
                        const k = `${t.id}_pre`;
                        if(!notificationsSentRef.current.has(k)) {
                            showToast(`10 Menit lagi: ${t.title}`);
                            fireSystemNotification("Siap-siap!", `10 Menit lagi: ${t.title}`);
                            playCoinSound();
                            notificationsSentRef.current.add(k);
                        }
                    }

                    // Start
                    if (t.time === timeStr) {
                         const k = `${t.id}_start_${timeStr}`;
                         if(!notificationsSentRef.current.has(k)) {
                             triggerAlarm(t.title);
                             fireSystemNotification("Misi Dimulai!", t.title);
                             notificationsSentRef.current.add(k);
                         }
                    }

                    // Overdue
                    if (t.endTime && !t.completed) {
                        if (timeStr > t.endTime) {
                             const k = `${t.id}_late_${t.endTime}`; 
                             if (!notificationsSentRef.current.has(k)) {
                                showToast(`Waktu Habis! Anda melewatkan: ${t.title}`);
                                fireSystemNotification("Waktu Habis!", `Anda melewatkan: ${t.title}`);
                                playCoinSound();
                                notificationsSentRef.current.add(k);
                             }
                        }
                    }
                });
            };

            const stopAlarm = () => {
                setIsRinging(false);
                if (oscillatorRef.current) oscillatorRef.current.stop();
                if (audioContextRef.current) audioContextRef.current.close();
            };

            // Task Handlers
            const handleAddTask = () => {
                if (!newTitle) return showToast("Judul wajib diisi");
                if (schedules.filter(s => s.day === newDay).length >= 10) return showToast("Max 10 misi/hari!");
                if (newTitle.length < 3) return showToast("Judul terlalu pendek");
                
                const [sh, sm] = newTime.split(':').map(Number);
                const [eh, em] = newEndTime.split(':').map(Number);
                if (eh*60+em <= sh*60+sm) return showToast("Waktu selesai salah!");
                if ((eh*60+em) - (sh*60+sm) < 10) return showToast("Min. durasi 10 menit");

                setSchedules([...schedules, { id: Date.now(), title: newTitle, time: newTime, endTime: newEndTime, day: newDay, active: true, completed: false }]);
                setNewTitle(''); setIsModalOpen(false); showToast("Misi ditambah!");

                const now = new Date();
                const currentDay = getDayName(now);
                if(taskDay !== currentDay) return false;
                const [h, m] = taskTimeStr.split(':');
                const taskDate = new Date();
                taskDate.setHours(h, m, 0, 0);
                return now >= taskDate;
            };

            const completeTask = (id) => {
                const task = schedules.find(s => s.id === id);
                if (!task) return;
                
                // Validate Time
                const now = new Date();
                if (getDayName(now) !== task.day) return showToast("Bukan jadwal hari ini!");
                const [h, m] = task.time.split(':').map(Number);
                const start = new Date(); start.setHours(h, m, 0, 0);
                if (now < start) return showToast("Belum waktunya dimulai!");

                setSchedules(schedules.map(s => s.id === id ? { ...s, active: false, completed: true } : s));

                playCoinSound();

                        {/* MOBILE BOTTOM NAVBAR (Hidden on Desktop) */}
                        <nav className={`md:hidden absolute bottom-0 w-full px-6 py-2 flex justify-between items-center z-40 border-t ${theme.navBg} border-gray-700/30 pb-safe`}>
                            <button onClick={() => setActiveTab('home')} className={`flex flex-col items-center gap-1 p-2 relative transition-colors ${activeTab === 'home' ? 'text-blue-500' : 'text-gray-500'}`}>
                                <ClockIcon size={24}/><span className="text-[10px] font-bold">Misi</span>
                            </button>
                            <button onClick={() => setActiveTab('shop')} className={`flex flex-col items-center gap-1 p-2 relative transition-colors ${activeTab === 'shop' ? 'text-blue-500' : 'text-gray-500'}`}>
                                <StoreIcon size={24}/><span className="text-[10px] font-bold">Toko</span>
                            </button>
                            
                            <div className="relative -top-6 mx-2">
                                <button onClick={() => { setNewDay(selectedDay); setIsModalOpen(true); }} className="w-14 h-14 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-full flex items-center justify-center shadow-xl active:scale-95 border-4 border-gray-100 dark:border-gray-900 transition-transform">
                                    <PlusIcon size={28}/>
                                </button>
                            </div>

                            <div className="w-[48px]"></div> {/* Placeholder untuk menyeimbangkan layout tengah */}
                            
                            <button onClick={() => setActiveTab('profile')} className={`flex flex-col items-center gap-1 p-2 relative transition-colors ${activeTab === 'profile' ? 'text-blue-500' : 'text-gray-500'}`}>
                                <UserIcon size={24}/><span className="text-[10px] font-bold">Profil</span>
                            </button>
                        </nav>

                        {/* --- MODALS (Responsive Centered) --- */}
                        
                        {/* ADD TASK MODAL */}
                        {isModalOpen && (
                            <div className="absolute inset-0 z-[100] bg-black/60 flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-sm animate-in fade-in">
                                <div className={`w-full md:max-w-lg rounded-t-3xl md:rounded-3xl p-6 ${theme.modalBg} shadow-2xl animate-in slide-in-from-bottom md:zoom-in-95 duration-200 mb-safe-bottom md:mb-0`}>
                                    <div className="flex justify-between items-center mb-6"><h3 className="text-xl font-bold">Tambah Misi</h3><button onClick={() => setIsModalOpen(false)} className="p-2 hover:bg-gray-500/20 rounded-full transition-colors"><XIcon size={20}/></button></div>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <label className={`block text-xs font-bold mb-2 uppercase ${theme.subText}`}>Pilih Hari</label>
                                            <div className="flex gap-2 overflow-x-auto pb-2 custom-scrollbar snap-x">{DAYS.map(d => <button key={d} onClick={() => setNewDay(d)} className={`px-4 py-2 rounded-xl text-sm font-bold snap-center whitespace-nowrap transition-all border ${newDay === d ? 'bg-blue-600 border-blue-600 text-white shadow-md' : `border-gray-500/30 ${theme.text} hover:bg-gray-500/10`}`}>{d}</button>)}</div>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1"><label className={`block text-xs font-bold mb-2 uppercase ${theme.subText}`}>Jam Mulai</label><input type="time" value={newTime} onChange={e => setNewTime(e.target.value)} className={`w-full p-4 rounded-xl text-xl text-center font-mono focus:ring-2 focus:ring-blue-500 outline-none border ${theme.inputBg}`}/></div>
                                            <div className="flex-1"><label className={`block text-xs font-bold mb-2 uppercase ${theme.subText}`}>Jam Selesai</label><input type="time" value={newEndTime} onChange={e => setNewEndTime(e.target.value)} className={`w-full p-4 rounded-xl text-xl text-center font-mono focus:ring-2 focus:ring-blue-500 outline-none border ${theme.inputBg}`}/></div>
                                        </div>
                                        <div>
                                            <label className={`block text-xs font-bold mb-2 uppercase ${theme.subText}`}>Nama Kegiatan</label>
                                            <input type="text" placeholder="Contoh: Belajar Coding..." value={newTitle} onChange={e => setNewTitle(e.target.value)} className={`w-full p-4 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none border font-medium ${theme.inputBg}`}/>
                                        </div>
                                        <button onClick={handleAddTask} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold shadow-lg active:scale-95 transition-all mt-2">Simpan Misi</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* MODAL: EDIT PROFILE */}
                        {isEditProfileModalOpen && (
                            <div className="absolute inset-0 z-[100] bg-black/60 flex items-end md:items-center justify-center p-0 md:p-4 backdrop-blur-sm animate-in fade-in">
                                <div className={`w-full md:max-w-xl rounded-t-3xl md:rounded-3xl p-6 md:p-8 ${theme.modalBg} shadow-2xl max-h-[90vh] flex flex-col animate-in slide-in-from-bottom md:zoom-in-95 duration-200`}>
                                    <div className="flex justify-between items-center mb-6 shrink-0"><h3 className="text-xl font-bold">Edit Profil</h3><button onClick={() => setIsEditProfileModalOpen(false)} className="p-2 hover:bg-gray-500/20 rounded-full transition-colors"><XIcon size={20}/></button></div>
                                    
                                    <div className="flex-1 overflow-y-auto custom-scrollbar px-2 space-y-8">
                                        <div className="text-center">
                                            <div className="relative inline-block group mb-6">
                                                <UserAvatar src={userProfile.avatar} borderId={userProfile.border} size="xl" />
                                                <button onClick={() => fileInputRef.current.click()} className="absolute bottom-0 right-0 bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-full shadow-lg transition-colors"><CameraIcon size={18}/></button>
                                                <input type="file" ref={fileInputRef} onChange={handleImageUpload} className="hidden" accept="image/*"/>
                                            </div>
                                            <input type="text" value={userProfile.name} onChange={e => setUserProfile(p => ({...p, name: e.target.value}))} className={`w-full p-4 rounded-xl text-center font-bold text-xl outline-none focus:ring-2 border focus:border-blue-500 ${theme.inputBg}`}/>
                                        </div>

                                        <div>
                                            <h4 className={`text-sm font-bold uppercase mb-3 ${theme.subText}`}>Pilih Avatar Bawaan</h4>
                                            <div className="grid grid-cols-4 sm:grid-cols-6 gap-3">
                                                {AVATARS.map((url, i) => (
                                                    <img key={i} src={url} onClick={() => setUserProfile({...userProfile, avatar: url})} className={`w-14 h-14 rounded-full mx-auto cursor-pointer border-2 transition-all ${userProfile.avatar === url ? 'border-blue-500 scale-110 shadow-md' : 'border-transparent opacity-60 hover:opacity-100 bg-gray-200 dark:bg-gray-700'}`} />
                                                ))}
                                            </div>
                                        </div>

                                        <div>
                                            <h4 className={`text-sm font-bold uppercase mb-3 flex items-center gap-2 ${theme.subText}`}><FrameIcon size={16}/> Bingkai Dimiliki</h4>
                                            <div className="grid grid-cols-4 sm:grid-cols-5 gap-4">
                                                {ownedBorders.map(id => {
                                                    const b = BORDERS.find(x => x.id === id);
                                                    if (!b) return null;
                                                    return (
                                                        <div key={id} onClick={() => setUserProfile(p => ({...p, border: id}))} className={`relative cursor-pointer transition-transform active:scale-95 flex flex-col items-center gap-2 ${userProfile.border === id ? 'scale-105' : 'opacity-70 hover:opacity-100'}`}>
                                                            <div className={`${b.css} rounded-full p-1.5`}><img src={userProfile.avatar} className="w-10 h-10 rounded-full object-cover bg-gray-800"/></div>
                                                            {userProfile.border === id && <div className="absolute -top-1 -right-1 bg-blue-500 rounded-full p-1 shadow-md"><CheckCircleIcon size={12} className="text-white"/></div>}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="shrink-0 pt-4 mt-2 mb-safe-bottom">
                                        <button onClick={() => setIsEditProfileModalOpen(false)} className="w-full bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold shadow-lg transition-colors text-lg">Selesai & Simpan</button>
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
